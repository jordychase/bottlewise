<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colors — Accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  .stack { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw {
    border-radius: var(--r-3);
    border: 1px solid var(--border);
    padding: 14px;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .sw .name { font-size: var(--fs-13); font-weight: 600; }
  .sw .hex { font-family: var(--font-mono); font-size: var(--fs-12); }
  .demo {
    background: #FBF7EE;
    border-radius: var(--r-3);
    border: 1px solid var(--border);
    padding: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .badge { padding: 4px 10px; border-radius: 999px; font-size: var(--fs-12); font-weight: 600; }
</style>
</head>
<body>
  <div class="card-shell">
    <div class="stack">
      <div class="sw" style="background:#F2DECE"><span class="name" style="color:#1F2A26">Clay-soft</span><span class="hex" style="color:#5A6862">#F2DECE</span></div>
      <div class="sw" style="background:#C77E5C;color:#FBF7EE"><span class="name">Clay</span><span class="hex" style="color:rgba(251,247,238,0.75)">#C77E5C</span></div>
      <div class="sw" style="background:#F1E2BD"><span class="name" style="color:#1F2A26">Honey-soft</span><span class="hex" style="color:#5A6862">#F1E2BD</span></div>
      <div class="sw" style="background:#D4A24C;color:#1F2A26"><span class="name">Honey</span><span class="hex" style="color:rgba(31,42,38,0.6)">#D4A24C</span></div>
    </div>
    <div class="demo">
      <span class="badge" style="background:#F2DECE;color:#8C4A2D">+12% landed cost</span>
      <span class="badge" style="background:#F1E2BD;color:#7C5B1A">European import</span>
      <span class="badge" style="background:#FBF7EE;color:#5A6862;border:1px solid #E6DFCF">No palm oil</span>
    </div>
  </div>
</body>
</html>
