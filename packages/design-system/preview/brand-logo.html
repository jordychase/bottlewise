<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  .grid-l { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .tile {
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 28px;
    display: flex; align-items: center; justify-content: center;
    min-height: 130px;
  }
  .tile.dark { background: #1F2A26; border-color: #1F2A26; }
  .tile.sage { background: #DCE6DF; }
  .meta { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); margin-top: 6px; }
</style>
</head>
<body>
  <div class="card-shell">
    <div class="grid-l">
      <div>
        <div class="tile" style="background:#FBF7EE">
          <img src="../assets/logo/bottlewise-wordmark.svg" alt="Bottlewise" style="height:40px">
        </div>
        <div class="meta">Wordmark on paper · primary lockup</div>
      </div>
      <div>
        <div class="tile dark">
          <div style="display:flex;align-items:center;gap:12px;color:#FBF7EE">
            <div style="color:#FBF7EE;width:36px;height:36px;display:flex;align-items:center;justify-content:center"><img src="../assets/logo/bottlewise-mark.svg" style="width:36px;height:36px;filter:invert(1) brightness(1.4)" alt=""></div>
            <span style="font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:-0.01em">Bottlewise</span>
          </div>
        </div>
        <div class="meta">Reversed on ink</div>
      </div>
      <div>
        <div class="tile sage">
          <img src="../assets/logo/bottlewise-mark.svg" alt="" style="width:48px;height:48px">
        </div>
        <div class="meta">Mark only · for app icons / favicons</div>
      </div>
      <div>
        <div class="tile" style="background:#F6F1E8;flex-direction:column;gap:6px;align-items:flex-start">
          <span style="font-family:var(--font-display);font-size:14px;color:#5A6862">⚠ Placeholder</span>
          <span style="font-size:13px;color:#5A6862;line-height:1.4">Hand-drawn line. Real mark TBD before beta.</span>
        </div>
        <div class="meta">Substitution flag</div>
      </div>
    </div>
  </div>
</body>
</html>
