<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  .row-r { display: flex; gap: 16px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .swatch { width: 90px; height: 90px; background: #6B8E7F; }
  .label { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--fg-2); }
  .pill { padding: 8px 18px; background: #6B8E7F; color: #FBF7EE; border-radius: 999px; font-size: var(--fs-13); font-weight: 600; }
</style>
</head>
<body>
  <div class="card-shell">
    <div class="row-r">
      <div class="item"><div class="swatch" style="border-radius:2px"></div><span class="label">--r-1 / 2</span></div>
      <div class="item"><div class="swatch" style="border-radius:8px"></div><span class="label">--r-2 / 8</span></div>
      <div class="item"><div class="swatch" style="border-radius:12px"></div><span class="label">--r-3 / 12</span></div>
      <div class="item"><div class="swatch" style="border-radius:16px"></div><span class="label">--r-4 / 16</span></div>
      <div class="item"><div class="swatch" style="border-radius:24px"></div><span class="label">--r-5 / 24</span></div>
      <div class="item"><div class="pill">pill / 999</div><span class="label">--r-pill</span></div>
    </div>
  </div>
</body>
</html>
