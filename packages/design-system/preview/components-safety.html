<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Safety interstitial</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { background: #2A211D; padding: 32px; }
  .sheet {
    max-width: 540px;
    margin: 0 auto;
    background: #FBF7EE;
    border-radius: 24px;
    padding: 28px 24px 22px;
    border: 1px solid #E6DFCF;
    box-shadow: 0 24px 48px -16px rgba(0,0,0,0.32);
  }
  .badge {
    width: 44px; height: 44px;
    background: #ECCFC8;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #A94B3B;
    margin-bottom: 14px;
  }
  h1 { font-family: var(--font-display); font-size: 24px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 10px; }
  p { color: #1F2A26; font-size: 16px; line-height: 1.5; margin-bottom: 14px; }
  strong { background: #ECCFC8; padding: 1px 4px; border-radius: 3px; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .btn { padding: 12px 16px; border-radius: 12px; font-size: 15px; font-weight: 600; text-align: center; border: none; cursor: pointer; font-family: inherit; }
  .danger { background: #A94B3B; color: #FBF7EE; }
  .ghost { background: transparent; color: #1F2A26; border: 1px solid #C9C0AB; }
</style>
</head>
<body>
  <div class="card-shell">
    <div class="sheet">
      <div class="badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.86 2h8.28L22 7.86v8.28L16.14 22H7.86L2 16.14V7.86L7.86 2z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      </div>
      <h1>A few words before we go further.</h1>
      <p>You mentioned <strong>blood in the stool</strong>. That's something a pediatrician should look at today, not something Bottlewise can help you reason about.</p>
      <p style="color:#5A6862;font-size:14px">When you're ready, we'll be here.</p>
      <div class="actions">
        <button class="btn danger">Call your pediatrician</button>
        <button class="btn ghost">I've already spoken to them</button>
      </div>
    </div>
  </div>
</body>
</html>
