<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label { display: block; font-size: var(--fs-13); font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  input[type=text], input[type=email], select, textarea {
    width: 100%;
    background: #FBF7EE;
    border: 1px solid #C9C0AB;
    border-radius: 12px;
    padding: 12px 14px;
    font: 400 var(--fs-15) var(--font-body);
    color: var(--ink);
  }
  input.focus { border-color: #6B8E7F; outline: 2px solid #6B8E7F; outline-offset: 2px; }
  .helper { font-size: var(--fs-12); color: var(--fg-2); margin-top: 6px; }
  .check-row { display: flex; align-items: center; gap: 10px; }
  .check {
    width: 20px; height: 20px; border-radius: 6px;
    border: 1.5px solid #C9C0AB; background: #FBF7EE;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .check.on { background: #6B8E7F; border-color: #6B8E7F; }
  .toggle { width: 40px; height: 24px; background: #C9C0AB; border-radius: 999px; position: relative; }
  .toggle::after { content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:999px; background:#FBF7EE; transition: left .15s; }
  .toggle.on { background: #6B8E7F; }
  .toggle.on::after { left: 18px; }
</style>
</head>
<body>
  <div class="card-shell">
    <div class="grid2">
      <div>
        <label>Baby's name <span style="color:#94A09B;font-weight:400">(optional)</span></label>
        <input type="text" placeholder="e.g. Maya" class="focus" value="Maya">
        <div class="helper">Used only inside your account.</div>
      </div>
      <div>
        <label>Date of birth</label>
        <input type="text" placeholder="MM / DD / YYYY">
        <div class="helper">We use age to match a stage.</div>
      </div>
      <div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="check-row"><span class="check on"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FBF7EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span>Cow milk allergy in family</span></div>
          <div class="check-row"><span class="check"></span><span>Soy allergy</span></div>
          <div class="check-row"><span class="check"></span><span>Eczema</span></div>
        </div>
      </div>
      <div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;justify-content:space-between;align-items:center"><span>Notify when stock changes</span><span class="toggle on"></span></div>
          <div style="display:flex;justify-content:space-between;align-items:center"><span>Include European imports</span><span class="toggle"></span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
