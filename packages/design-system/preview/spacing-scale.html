<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  table { width: 100%; border-collapse: collapse; font-size: var(--fs-14); }
  td { padding: 8px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
  td:first-child { font-family: var(--font-mono); color: var(--fg-2); width: 64px; }
  td:nth-child(2) { font-family: var(--font-mono); color: var(--fg-2); width: 56px; text-align: right; padding-right: 12px;}
  .bar { background: #6B8E7F; height: 12px; border-radius: 2px; }
</style>
</head>
<body>
  <div class="card-shell">
    <table>
      <tr><td>--space-1</td><td>4</td><td><div class="bar" style="width:4px"></div></td></tr>
      <tr><td>--space-2</td><td>8</td><td><div class="bar" style="width:8px"></div></td></tr>
      <tr><td>--space-3</td><td>12</td><td><div class="bar" style="width:12px"></div></td></tr>
      <tr><td>--space-4</td><td>16</td><td><div class="bar" style="width:16px"></div></td></tr>
      <tr><td>--space-5</td><td>20</td><td><div class="bar" style="width:20px"></div></td></tr>
      <tr><td>--space-6</td><td>24</td><td><div class="bar" style="width:24px"></div></td></tr>
      <tr><td>--space-8</td><td>32</td><td><div class="bar" style="width:32px"></div></td></tr>
      <tr><td>--space-10</td><td>40</td><td><div class="bar" style="width:40px"></div></td></tr>
      <tr><td>--space-14</td><td>56</td><td><div class="bar" style="width:56px"></div></td></tr>
      <tr><td>--space-18</td><td>72</td><td><div class="bar" style="width:72px"></div></td></tr>
      <tr><td>--space-24</td><td>96</td><td><div class="bar" style="width:96px"></div></td></tr>
    </table>
  </div>
</body>
</html>
