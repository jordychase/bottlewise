# Supabase project config.
# Initialize the local stack with: supabase init && supabase start
# Apply migrations with: supabase db reset (local) or supabase db push (remote)

project_id = "bottlewise"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false  # local dev only; production should require confirmation

[storage]
enabled = true
file_size_limit = "50MiB"
